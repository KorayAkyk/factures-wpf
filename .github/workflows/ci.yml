name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer le SDK .NET de global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Fixer le numero de version
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=1.0.${{ github.run_number }}"

      - name: Restaurer
        run: dotnet restore FacturesWpf.sln

      - name: Compiler
        run: dotnet build FacturesWpf.sln --no-restore -c ${{ env.CONFIGURATION }} -p:Version=${{ env.APP_VERSION }}

      - name: Tests metier, stockage et ViewModels
        run: dotnet test tests/Factures.Tests --no-build -c ${{ env.CONFIGURATION }} --logger "trx;LogFileName=metier.trx" --logger "console;verbosity=normal" --results-directory artifacts/tests

      - name: Tests des vues WPF
        run: dotnet test tests/Factures.App.Tests --no-build -c ${{ env.CONFIGURATION }} --logger "trx;LogFileName=vues.trx" --logger "console;verbosity=normal" --results-directory artifacts/tests

      - name: Publier l'application
        run: dotnet msbuild build/Package.proj -t:Publish -p:Version=${{ env.APP_VERSION }}

      - name: Parcours de fumee de l'application publiee
        shell: powershell
        run: ./build/ui-smoke.ps1 -ExePath artifacts/publish/FacturesWpf.exe -CaptureDir artifacts/captures

      - name: Construire le MSI
        run: dotnet msbuild build/Package.proj -t:Msi -p:Version=${{ env.APP_VERSION }}

      - name: Installer, lancer et desinstaller le MSI
        shell: powershell
        run: ./build/msi-check.ps1 -MsiPath "artifacts/msi/FacturesWpf-${{ env.APP_VERSION }}-x64.msi" -LogDir artifacts/msi-logs

      - name: Construire le paquet NuGet du metier
        run: dotnet msbuild build/Package.proj -t:Pack -p:Version=${{ env.APP_VERSION }}

      - name: Joindre le MSI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FacturesWpf-msi
          path: artifacts/msi/*.msi
          if-no-files-found: error

      - name: Joindre le paquet NuGet
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FacturesWpf-nuget
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

      - name: Joindre les captures d'ecran
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures
          path: artifacts/captures
          if-no-files-found: warn

      - name: Joindre les resultats de tests et journaux
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultats
          path: |
            artifacts/tests
            artifacts/msi-logs
          if-no-files-found: warn
